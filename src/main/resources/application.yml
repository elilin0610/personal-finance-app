spring:
  application:
    name: personal-finance-app
  datasource:
    url: jdbc:h2:file:./data/finance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-very-long-secret-for-production-use}
    jwt-expiration-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

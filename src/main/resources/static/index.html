<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Finance App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-wallet2 text-primary me-2"></i>Personal Finance
        </a>
        <div class="d-flex align-items-center gap-2">
            <span id="userBadge" class="badge text-bg-light d-none"></span>
            <button id="logoutButton" class="btn btn-outline-secondary btn-sm d-none">
                <i class="bi bi-box-arrow-right me-1"></i>登出
            </button>
        </div>
    </div>
</nav>

<main class="container-fluid p-4">
    <section class="hero-panel mb-4">
        <div class="row g-4 align-items-center">
            <div class="col-lg-7">
                <div class="eyebrow mb-2">Spring Boot Portfolio Project</div>
                <h1 class="display-title mb-3">個人理財管理系統</h1>
                <p class="lead mb-4">整合 JWT 登入、收支分類、交易紀錄、月預算與報表分析，前後端都能直接展示給面試官看。</p>
                <div class="d-flex flex-wrap gap-2">
                    <button id="demoLoginButton" class="btn btn-primary">
                        <i class="bi bi-lightning-charge me-1"></i>使用 Demo 登入
                    </button>
                    <a class="btn btn-outline-primary" href="/api/status" target="_blank">
                        <i class="bi bi-braces me-1"></i>查看 API 狀態
                    </a>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="metric-board">
                    <div>
                        <span>本月收入</span>
                        <strong id="incomeMetric">$0</strong>
                    </div>
                    <div>
                        <span>本月支出</span>
                        <strong id="expenseMetric">$0</strong>
                    </div>
                    <div>
                        <span>現金流</span>
                        <strong id="cashFlowMetric">$0</strong>
                    </div>
                    <div>
                        <span>預算剩餘</span>
                        <strong id="budgetMetric">$0</strong>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-xl-4">
            <section class="tool-panel mb-4">
                <div class="panel-heading">
                    <h2>登入</h2>
                    <span class="text-secondary">Demo: demo@finance.dev / password123</span>
                </div>
                <form id="loginForm" class="vstack gap-3">
                    <div>
                        <label class="form-label" for="emailInput">Email</label>
                        <input id="emailInput" class="form-control" type="email" value="demo@finance.dev" required>
                    </div>
                    <div>
                        <label class="form-label" for="passwordInput">Password</label>
                        <input id="passwordInput" class="form-control" type="password" value="password123" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="bi bi-shield-lock me-1"></i>登入系統
                    </button>
                </form>
            </section>

            <section class="tool-panel">
                <div class="panel-heading">
                    <h2>新增分類</h2>
                    <span class="text-secondary">收入或支出類別</span>
                </div>
                <form id="categoryForm" class="vstack gap-3">
                    <input id="categoryNameInput" class="form-control" placeholder="例如：餐飲" required>
                    <select id="categoryTypeInput" class="form-select">
                        <option value="EXPENSE">支出</option>
                        <option value="INCOME">收入</option>
                    </select>
                    <input id="categoryColorInput" class="form-control form-control-color" type="color" value="#2563eb" title="分類顏色">
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="bi bi-plus-circle me-1"></i>新增分類
                    </button>
                </form>
            </section>
        </div>

        <div class="col-xl-8">
            <section class="tool-panel mb-4">
                <div class="panel-heading">
                    <h2>新增交易</h2>
                    <span class="text-secondary">快速記錄收入與支出</span>
                </div>
                <form id="transactionForm" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="transactionTypeInput">類型</label>
                        <select id="transactionTypeInput" class="form-select">
                            <option value="EXPENSE">支出</option>
                            <option value="INCOME">收入</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="transactionCategoryInput">分類</label>
                        <select id="transactionCategoryInput" class="form-select" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="amountInput">金額</label>
                        <input id="amountInput" class="form-control" type="number" min="0.01" step="0.01" value="120" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="dateInput">日期</label>
                        <input id="dateInput" class="form-control" type="date" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="merchantInput">商家 / 來源</label>
                        <input id="merchantInput" class="form-control" value="Coffee Shop" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="noteInput">備註</label>
                        <input id="noteInput" class="form-control" placeholder="可留空">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-check2-circle me-1"></i>儲存交易
                        </button>
                    </div>
                </form>
            </section>

            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="tool-panel h-100">
                        <div class="panel-heading">
                            <h2>分類</h2>
                            <span id="categoryCount" class="text-secondary">0 筆</span>
                        </div>
                        <div id="categoryList" class="vstack gap-2"></div>
                    </section>
                </div>
                <div class="col-lg-7">
                    <section class="tool-panel h-100">
                        <div class="panel-heading">
                            <h2>本月交易</h2>
                            <span id="transactionCount" class="text-secondary">0 筆</span>
                        </div>
                        <div id="transactionList" class="transaction-list"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
